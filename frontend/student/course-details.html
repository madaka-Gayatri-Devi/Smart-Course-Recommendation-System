<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details - SmartLearn</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/courses.css">
</head>
<body class="dashboard-body">

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    
        <!-- 🎓 STUDENT SIDEBAR -->
    <aside class="dashboard-sidebar" id="dashboardSidebar">
        <div class="sidebar-glow-1"></div>
        <div class="sidebar-glow-2"></div>

        <div class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap"></i> SmartLearn
        </div>
        
        <nav class="sidebar-nav">
            <div class="nav-label">LEARNING</div>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i> <span class="nav-text">Dashboard</span></a>
            <a href="courses.html" class="nav-item active"><i class="fa-solid fa-book-open"></i> <span class="nav-text">Course Catalog</span></a>
            <a href="my-courses.html" class="nav-item"><i class="fa-solid fa-graduation-cap"></i> <span class="nav-text">My Courses</span></a>
            <a href="learning-path.html" class="nav-item"><i class="fa-solid fa-road"></i> <span class="nav-text">Learning Path</span></a>
            <a href="progress.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> <span class="nav-text">Progress</span></a>
            
            <div class="nav-label">DISCOVER</div>
            <a href="recommendations.html" class="nav-item"><i class="fa-solid fa-compass"></i> <span class="nav-text">Recommendations</span></a>
            <a href="skill-gaps.html" class="nav-item"><i class="fa-solid fa-layer-group"></i> <span class="nav-text">Skill Gaps</span></a>
            <a href="assessment.html" class="nav-item"><i class="fa-solid fa-clipboard-question"></i> <span class="nav-text">Assessment</span></a>
            <a href="wishlist.html" class="nav-item"><i class="fa-solid fa-heart"></i> <span class="nav-text">Wishlist</span></a>
            
            <div class="nav-label">ACCOUNT</div>
            <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i> <span class="nav-text">Profile</span></a>
            <a href="notifications.html" class="nav-item"><i class="fa-solid fa-bell"></i> <span class="nav-text">Notifications</span></a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="sidebar-user-card">
                <div class="sidebar-user-avatar" id="sidebarAvatar">ST</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name" id="sidebarName">Student</span>
                    <span class="sidebar-user-role" id="sidebarRole">Student</span>
                </div>
            </div>
            <div class="sidebar-footer-links">
                <a href="profile.html" class="sidebar-mini-link" title="Settings"><i class="fa-solid fa-gear"></i> Settings</a>
                <a href="#" class="sidebar-mini-link text-danger logout-btn" id="logoutBtn" title="Logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </div>
    </aside>
    

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <h2 class="page-title"><a href="courses.html" style="color: var(--secondary-text); font-size: 14px; text-decoration: none;"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Courses</a></h2>
            </div>
            
            <div class="topbar-right">
                <div class="profile-dropdown">
                    <div class="avatar" id="topAvatar">ST</div>
                    <span class="profile-name" id="topName">Student</span>
                </div>
            </div>
        </header>

        <div class="dashboard-content fade-in-up" id="courseDetailsContent">
            <div style="text-align: center; padding: 4rem; color: var(--secondary-text);">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 2.5rem; color: var(--primary-purple); margin-bottom: 1rem;"></i>
                <p>Loading course information...</p>
            </div>
        </div>
    </main>

    <!-- Modal for Preview Lesson -->
    <div id="lessonPreviewModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div style="background: #FFFFFF; width: 92%; max-width: 800px; max-height: 88vh; border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #E2E8F0; padding-bottom: 0.75rem;">
                <div>
                    <span style="font-size: 11px; font-weight: 700; color: #059669; background: #ECFDF5; padding: 2px 8px; border-radius: 12px; text-transform: uppercase;">Free Sample Lesson</span>
                    <h3 id="previewModalTitle" style="margin: 0.25rem 0 0 0; font-size: 1.2rem; color: var(--dark-navy);">Lesson Preview</h3>
                </div>
                <button type="button" onclick="closeLessonPreviewModal()" style="border: none; background: none; font-size: 20px; color: #64748b; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="previewModalBody" style="flex: 1; overflow-y: auto; padding: 0.5rem 0;">
                <!-- Lesson player/viewer loaded here -->
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/courses.js"></script>
</body>
</html>
