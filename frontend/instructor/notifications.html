<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Notifications - SmartLearn</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css?v=15.0">
</head>
<body class="dashboard-body">

    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 👨‍🏫 INSTRUCTOR SIDEBAR -->
    <aside class="dashboard-sidebar app-sidebar" id="dashboardSidebar">
        <div class="sidebar-glow-1"></div>
        <div class="sidebar-glow-2"></div>

        <div class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap"></i> SmartLearn
        </div>
        
        <nav class="sidebar-nav">
            <div class="nav-label">TEACHING</div>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> <span class="nav-text">Dashboard</span></a>
            <a href="courses.html" class="nav-item"><i class="fa-solid fa-book-open"></i> <span class="nav-text">My Courses</span></a>
            <a href="course-editor.html" class="nav-item"><i class="fa-solid fa-plus-circle"></i> <span class="nav-text">Create Course</span></a>
            <a href="course-manage.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i> <span class="nav-text">Course Content</span></a>
            <a href="public-catalog.html" class="nav-item"><i class="fa-solid fa-globe"></i> <span class="nav-text">Public Catalog</span></a>
            <a href="students.html" class="nav-item"><i class="fa-solid fa-users"></i> <span class="nav-text">Students / Enrollments</span></a>
            <a href="reviews.html" class="nav-item"><i class="fa-solid fa-star"></i> <span class="nav-text">Ratings & Reviews</span></a>
            <a href="analytics.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> <span class="nav-text">Analytics</span></a>
            
            <div class="nav-label">ACCOUNT</div>
            <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i> <span class="nav-text">Profile</span></a>
            <a href="notifications.html" class="nav-item active"><i class="fa-solid fa-bell"></i> <span class="nav-text">Notifications</span></a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="sidebar-user-card">
                <div class="sidebar-user-avatar" id="sidebarAvatar">IN</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name" id="sidebarName">Instructor</span>
                    <span class="sidebar-user-role" id="sidebarRole">Instructor</span>
                </div>
            </div>
            <div class="sidebar-footer-links">
                <a href="profile.html" class="sidebar-mini-link" title="Settings"><i class="fa-solid fa-gear"></i> Settings</a>
                <a href="#" class="sidebar-mini-link text-danger logout-btn" id="logoutBtn" title="Logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
        
        <!-- Topbar -->
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <h2 class="page-title">Instructor Notifications</h2>
            </div>
            
            <div class="topbar-right" style="display: flex; align-items: center; gap: 1.25rem;">
                <a href="notifications.html" style="position: relative; color: var(--dark-navy); font-size: 18px; padding: 0.4rem;" title="Notifications">
                    <i class="fa-solid fa-bell"></i>
                    <span id="topNotificationBadge" style="display: none;"></span>
                </a>

                <div class="profile-dropdown">
                    <div class="avatar" id="topAvatar">IN</div>
                    <span class="profile-name" id="topName">Instructor</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="dashboard-content fade-in-up">
            <!-- Rendered by notifications.js -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const currentUser = await window.api.getMe();
                if (currentUser.role.toUpperCase() !== 'INSTRUCTOR' && currentUser.role.toUpperCase() !== 'ADMIN') {
                    window.location.href = '../login.html';
                    return;
                }

                const fullName = currentUser.full_name || 'Instructor';
                document.getElementById('topName').textContent = fullName;
                document.getElementById('sidebarName').textContent = fullName;
                document.getElementById('sidebarRole').textContent = 'Instructor';

                const names = fullName.trim().split(' ');
                let initials = names[0].charAt(0);
                if (names.length > 1) initials += names[1].charAt(0);
                initials = initials.toUpperCase();
                document.getElementById('topAvatar').textContent = initials;
                document.getElementById('sidebarAvatar').textContent = initials;
            } catch (_) {
                window.location.href = '../login.html';
            }

            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('dashboardSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (menuToggle && sidebar && overlay) {
                menuToggle.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
                overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
            }
            document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                window.api.clearToken();
                window.location.href = '../login.html';
            });
        });
    </script>
</body>
</html>
