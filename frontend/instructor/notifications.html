            <div class="nav-label">COMMUNICATION</div>
            <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i> <span class="nav-text">Course Chat & Messages</span> <span class="chat-unread-nav-badge badge" id="chatUnreadBadge" style="display:none; background:#EF4444; color:#fff; font-size:10px; padding:2px 6px; border-radius:99px; margin-left:auto;">0</span></a>
            <a href="notifications.html" class="nav-item active"><i class="fa-solid fa-bell"></i> <span class="nav-text">Notifications</span> <span class="notif-badge badge" id="notifUnreadBadge" style="display:none; background:#EF4444; color:#fff; font-size:10px; padding:2px 6px; border-radius:99px; margin-left:auto;">0</span></a>

    <!-- Main Content -->
    <main class="dashboard-main">
        
        <!-- Topbar -->
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <h2 class="page-title">Instructor Notifications</h2>
            </div>
            
            <div class="topbar-right" style="display: flex; align-items: center; gap: 1.25rem;">
                    <button type="button" id="themePaletteButton" class="theme-palette-btn" data-open-theme-modal aria-label="Theme & Appearance" title="Theme & Appearance" onclick="if(window.openThemeAppearanceModal) window.openThemeAppearanceModal(); else if(window.SmartLearnTheme) window.SmartLearnTheme.openModal();" style="background:none; border:none; cursor:pointer; font-size:18px; padding:0.4rem; display:inline-flex; align-items:center; justify-content:center;"><i class="fa-solid fa-palette"></i></button>
                <a href="notifications.html" style="position: relative; color: var(--dark-navy); font-size: 18px; padding: 0.4rem;" title="Notifications">
                    <i class="fa-solid fa-bell"></i>
                    <span id="topNotificationBadge" style="display: none;"></span>
                </a>

                <div class="profile-dropdown">
                    <div class="avatar" id="topAvatar">IN</div>
                    <span class="profile-name" id="topName">Instructor</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="dashboard-content fade-in-up">
            <!-- Rendered by notifications.js -->
        </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/chatbot.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = (window.auth && window.auth.getUser) ? window.auth.getUser() : (window.api ? window.api.getCurrentUser() : null);
            if (user) {
                const fullName = user.name || user.full_name || 'Instructor';
                const initials = fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'IN';
                const nameEls = document.querySelectorAll('#sidebarName, #topName');
                const roleEls = document.querySelectorAll('#sidebarRole');
                const avatarEls = document.querySelectorAll('#sidebarAvatar, #topAvatar');

                nameEls.forEach(el => el.textContent = fullName);
                roleEls.forEach(el => el.textContent = 'INSTRUCTOR');
                avatarEls.forEach(el => el.textContent = initials);
            }

            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('dashboardSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (menuToggle && sidebar && overlay) {
                menuToggle.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
                overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
            }
            document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                if (window.api && window.api.logout) {
                    window.api.logout();
                } else {
                    localStorage.removeItem('smartlearn_token');
                    localStorage.removeItem('smartlearn_user');
                    window.location.href = '../login.html';
                }
            });
        });
    </script>
</body>
</html>
